- DEF countriesEU=:
    - Spain
    - Germany
    - France
- DEF countriesNA=:
    - Canada
    - US
    - Mexico

- group_config: 

   - FOR country IN ${countriesEU}:
       - group-${country}-europe:
           - path: /home/groups/netcentric

   - FOR country IN ${union(countriesEU,countriesNA)}:
       - group-${country}-global:
           - path: /home/groups/netcentric

