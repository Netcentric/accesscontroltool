- group_config: 

  - testgroup: 
      - path: /home/groups/test

- DEF relevantNodes=[nodeA,nodeB-similar,nodeC]

- ace_config: 

    - testgroup: 

        - FOR item IN [nodeA,nodeB,nodeC,nodeD]:
             - IF ${containsItem(relevantNodes, item)}:

                - path: /content/path/${item}
                  permission: allow
                  privileges: rep:write
                  