- group_config:

    - DEF testArr=[val1,val2]

    - FOR arrVal IN ${testArr}:
    
        - content-reader-loop1-${arrVal}:

           - name: Name of ${arrVal}
             isMemberOf: 
             path: /home/groups/testloop


    - DEF testVal="val4"
    - DEF testArr2=[val3 , ${testVal},${testArr[0]}]

    - FOR arrVal IN ${testArr2}:
    
        - content-reader-loop2-${arrVal}:

           - name: Name of ${arrVal}
             isMemberOf: 
             path: /home/groups/testloop              